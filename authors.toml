# ==============================================================
# authors.toml — who wrote the paper
# ==============================================================
# AUTHORS. One block per author, in the order they should appear
# under the title. That order is also what the footer citation
# uses, so the first block is the first author.
#
# Each block stands on its own — fill it in like a form, with
# nothing to cross-reference. Write your affiliation out in full;
# build_cover.py collects the affiliations, removes the
# duplicates and numbers them by the order they first appear, so
# authors sharing an institution automatically share a number.
#
#   name_first     given names, however many you use    (required)
#   name_last      family name, as it should be sorted
#                  and cited                            (required)
#   affiliation    your institution, written out in full (required)
#   email          only the corresponding author's is shown
#   orcid          renders the ORCID mark beside your name
#   corresponding  marks you with * and prints your contact
#                  in the first-page sidebar
#
# The name is split in two so nothing has to guess where the
# family name begins. Put the whole family name in name_last,
# including particles and suffixes — "dos Santos", "Magalhães
# Filho" — and it will be cited correctly.
#
# Add an author by copying a block; remove one by deleting it.
# After editing, run:
#     python build_cover.py
# ==============================================================

